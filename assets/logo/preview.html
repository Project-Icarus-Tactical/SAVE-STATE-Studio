<title>Late Byte</title>
<style>
  :root{
    --bg:#1C1C1E;
  }
  body{background:var(--bg);}
  .page{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3.5rem;
    padding-block:3.5rem;
    padding-inline:1rem;
  }
  .block{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.9rem;
  }
  .caption{
    font-family:'Manrope', sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#6f6f76;
  }
  .stage{
    background:#141416;
    border:1px solid #2a2a2e;
    border-radius:12px;
    padding:2rem 2.5rem;
  }
  svg{ display:block; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">

<div class="page">

  <div class="block">
    <span class="caption">Hauptlogo</span>
    <div class="stage">
      <img src="logo-full.svg" width="220" height="260" alt="Late Byte">
    </div>
  </div>

  <div class="block">
    <span class="caption">Icon</span>
    <div class="stage">
      <img src="icon-only.svg" width="120" height="120" alt="Late Byte icon">
    </div>
  </div>

  <div class="block">
    <span class="caption">Fusszeile</span>
    <div class="stage">
      <img src="logo-footer.svg" width="220" height="70" alt="Late Byte">
    </div>
  </div>

</div>
