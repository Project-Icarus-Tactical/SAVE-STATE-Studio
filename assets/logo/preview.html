<title>Save State Studio</title>
<style>
  :root{
    --bg:#1C1C1E;
  }
  body{background:var(--bg);}
  .page{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3.5rem;
    padding-block:3.5rem;
    padding-inline:1rem;
  }
  .block{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.9rem;
  }
  .caption{
    font-family:'Manrope', sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#6f6f76;
  }
  .stage{
    background:#141416;
    border:1px solid #2a2a2e;
    border-radius:12px;
    padding:2rem 2.5rem;
  }
  svg{ display:block; }
  .pixel{ shape-rendering:crispEdges; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">

<div class="page">

  <div class="block">
    <span class="caption">Hauptlogo</span>
    <div class="stage">
      <svg width="240" height="210" viewBox="0 0 300 260" xmlns="http://www.w3.org/2000/svg">
        <text x="150" y="42" font-family="'Manrope', sans-serif" font-size="24" font-weight="800" fill="#e8e8ea" text-anchor="middle" letter-spacing="1.5">SAVE STATE</text>
        <text x="150" y="68" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#E2C766" text-anchor="middle" letter-spacing="6">STUDIO</text>

        <g class="pixel" transform="translate(70, 92) scale(2)" stroke="#0d0d0f" stroke-linejoin="miter">
          <path d="M 0,0 L 64,0 L 64,8 L 72,8 L 72,16 L 80,16 L 80,80 L 0,80 Z" fill="#3a3a40" stroke-width="3"/>
          <rect x="16" y="0" width="40" height="24" fill="#d8d4c8" stroke-width="3"/>
          <rect x="40" y="6" width="12" height="12" fill="#2a2a2e" stroke-width="0"/>
          <rect x="8" y="32" width="64" height="44" fill="#ece6d8" stroke-width="3"/>
          <rect x="10" y="34" width="60" height="6" fill="#E2C766" stroke="none"/>
          <rect x="14" y="48" width="46" height="3" fill="#a39d8c" stroke="none"/>
          <rect x="14" y="56" width="52" height="3" fill="#a39d8c" stroke="none"/>
          <rect x="14" y="64" width="40" height="3" fill="#a39d8c" stroke="none"/>
          <rect x="2" y="74" width="4" height="4" fill="#2a2a2e" stroke="none"/>
          <rect x="74" y="74" width="4" height="4" fill="#2a2a2e" stroke="none"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="block">
    <span class="caption">Fusszeile</span>
    <div class="stage">
      <svg width="220" height="70" viewBox="0 0 300 94" xmlns="http://www.w3.org/2000/svg">
        <g class="pixel" transform="translate(10, 12) scale(0.87)" stroke="#0d0d0f" stroke-linejoin="miter">
          <path d="M 0,0 L 64,0 L 64,8 L 72,8 L 72,16 L 80,16 L 80,80 L 0,80 Z" fill="#3a3a40" stroke-width="3"/>
          <rect x="16" y="0" width="40" height="24" fill="#d8d4c8" stroke-width="3"/>
          <rect x="40" y="6" width="12" height="12" fill="#2a2a2e" stroke-width="0"/>
          <rect x="8" y="32" width="64" height="44" fill="#ece6d8" stroke-width="3"/>
          <rect x="10" y="34" width="60" height="6" fill="#E2C766" stroke="none"/>
          <rect x="14" y="48" width="46" height="3" fill="#a39d8c" stroke="none"/>
          <rect x="14" y="56" width="52" height="3" fill="#a39d8c" stroke="none"/>
          <rect x="14" y="64" width="40" height="3" fill="#a39d8c" stroke="none"/>
          <rect x="2" y="74" width="4" height="4" fill="#2a2a2e" stroke="none"/>
          <rect x="74" y="74" width="4" height="4" fill="#2a2a2e" stroke="none"/>
        </g>
        <text x="90" y="40" font-family="'Manrope', sans-serif" font-size="17" font-weight="800" fill="#e8e8ea" letter-spacing="1">SAVE STATE</text>
        <text x="90" y="61" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#E2C766" letter-spacing="4">STUDIO</text>
      </svg>
    </div>
  </div>

</div>
