<svg viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
  <title>Late Byte</title>
  <defs>
    <radialGradient id="ambGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E2C766" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E2C766" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moonFill" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D2A233"/>
      <stop offset="100%" stop-color="#F9EBC0"/>
    </linearGradient>
    <mask id="moonMask">
      <circle cx="102" cy="172" r="38" fill="white"/>
      <circle cx="117" cy="156" r="32" fill="black"/>
    </mask>
    <filter id="moonGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <text x="110" y="42" font-family="'Manrope', sans-serif" font-size="30" font-weight="800" text-anchor="middle" letter-spacing="1">
    <tspan fill="#e8e8ea">LATE </tspan><tspan fill="#E2554C">BYTE</tspan>
  </text>
  <text x="110" y="68" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#E2C766" text-anchor="middle" letter-spacing="6">STUDIO</text>

  <circle cx="110" cy="172" r="60" fill="url(#ambGlow)"/>
  <circle cx="102" cy="172" r="38" fill="url(#moonFill)" mask="url(#moonMask)" filter="url(#moonGlow)"/>
</svg>
