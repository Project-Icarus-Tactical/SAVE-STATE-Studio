<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <title>Late Byte icon</title>
  <defs>
    <radialGradient id="ambGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E2C766" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E2C766" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moonFill" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D2A233"/>
      <stop offset="100%" stop-color="#F9EBC0"/>
    </linearGradient>
    <mask id="moonMask">
      <circle cx="44" cy="50" r="28" fill="white"/>
      <circle cx="55" cy="38" r="24" fill="black"/>
    </mask>
    <filter id="moonGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="44" fill="url(#ambGlow)"/>
  <circle cx="44" cy="50" r="28" fill="url(#moonFill)" mask="url(#moonMask)" filter="url(#moonGlow)"/>
</svg>
