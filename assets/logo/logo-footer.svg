<svg viewBox="0 0 260 70" xmlns="http://www.w3.org/2000/svg">
  <title>Late Byte</title>
  <defs>
    <radialGradient id="ambGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E2C766" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E2C766" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moonFill" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D2A233"/>
      <stop offset="100%" stop-color="#F9EBC0"/>
    </linearGradient>
    <mask id="moonMask">
      <circle cx="35" cy="35" r="20" fill="white"/>
      <circle cx="43" cy="26" r="17" fill="black"/>
    </mask>
    <filter id="moonGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="35" cy="35" r="31" fill="url(#ambGlow)"/>
  <circle cx="35" cy="35" r="20" fill="url(#moonFill)" mask="url(#moonMask)" filter="url(#moonGlow)"/>

  <text x="76" y="33" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" letter-spacing="0.5">
    <tspan fill="#e8e8ea">LATE </tspan><tspan fill="#E2554C">BYTE</tspan>
  </text>
  <text x="76" y="49" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" fill="#E2C766" letter-spacing="4">STUDIO</text>
</svg>
